# Despliegue automatico a Cloudflare.
#
# - Pull request: solo corre los tests (no toca produccion).
# - Push a main (incluye el merge de un PR): tests -> migraciones D1 ->
#   despliega la app (Pages) -> despliega el worker de recordatorios.
#
# Requiere dos secrets en GitHub (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token con permisos: Cloudflare Pages:Edit,
#                          D1:Edit y Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez (las migraciones no deben correr en paralelo).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  desplegar:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Migraciones de la base D1
        run: npx wrangler d1 migrations apply agenda-practicos-db --remote

      - name: Desplegar app (Cloudflare Pages)
        run: npx wrangler pages deploy public --project-name agenda-practicos --branch main --commit-dirty=true

      - name: Desplegar worker de recordatorios
        working-directory: reminder-worker
        run: npx wrangler deploy
