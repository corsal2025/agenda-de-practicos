<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de Practicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="styles.css?v=20260908l">
</head>
<body>
  <div class="barra-nacion"></div>
  <header class="top">
    <div class="top-inner">
      <span class="marca" id="marca">
        <span class="marca-txt">
          <span class="marca-org">Departamento de Licencias de Conducir</span>
          <span class="marca-titulo">Agenda de Prácticos</span>
        </span>
      </span>
      <div class="top-right">
        <button id="tema" class="icono-btn" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
        <span class="estado" id="estado"></span>
      </div>
      <nav id="nav">
        <button data-tab="agenda" class="activo">Agenda</button>
        <button data-tab="disponibles">Citas disponibles</button>
        <button data-tab="reagendar">Reagendar</button>
        <button data-tab="buscar">Buscar</button>
        <button data-tab="dia">Agenda del día</button>
        <button data-tab="analitica">Analítica</button>
        <button data-tab="papelera">Papelera<span class="nav-badge" id="badge-papelera" hidden></span></button>
        <button data-tab="datos">Datos</button>
        <button data-tab="errores">Reporte de errores</button>
      </nav>
    </div>
  </header>

  <main id="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js?v=20260908l"></script>
</body>
</html>
