<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda de Practicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="styles.css?v=109">
  <link rel="stylesheet" href="responsive.css?v=92">
  <script src="tamano-letra.js?v=77"></script>
</head>
<body>
  <div class="barra-nacion"></div>
  <header class="top">
    <div class="top-inner">
      <div class="top-brand-group">
        <span class="marca" id="marca">
          <span class="marca-txt">
            <span class="marca-org">Departamento de Licencias de Conducir</span>
            <span class="marca-titulo">Agenda de Prácticos</span>
          </span>
        </span>
        <div class="buscador" id="buscador" role="search">
          <svg class="buscador-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.5 12.5l4.5 4.5"/></svg>
          <input id="bq" type="search" placeholder="Buscar" title="Buscar por RUT, nombre o teléfono" autocomplete="off" aria-label="Buscar contribuyente">
          <div id="bq-res" class="buscador-res" hidden></div>
        </div>
      </div>
      <div class="top-right">
        <span class="head-lico-wrap">
          <button id="head-lico" class="head-lico" type="button" aria-label="Lico tiene un consejo: pulsa para escucharlo (Alt+L)" title="Lico tiene un consejo para ti (Alt+L)" aria-keyshortcuts="Alt+L"><span data-lico="saluda" aria-hidden="true"></span></button>
          <div id="head-lico-burbuja" class="head-lico-burbuja" role="status" aria-live="polite" hidden></div>
        </span>
        <button id="btn-guia-global" class="btn-guia-accion" title="Cómo usar el sistema (Guía interactiva)" data-tooltip="Simulador interactivo con flecha explicativa que te enseña paso a paso cómo usar el sistema">
          <span class="lico-mini" data-lico="saluda" aria-hidden="true"></span>
          <span>Cómo usar el sistema</span>
        </button>
        <button id="lico-onoff" class="icono-btn" type="button" aria-pressed="true" title="Lico animado: activado (clic para desactivar)" aria-label="Lico animado: activado (clic para desactivar)">&#9786;</button>
        <button id="lico-consejos" class="icono-btn" type="button" aria-pressed="true" title="Consejos automáticos de Lico: activados (clic para desactivar)" aria-label="Consejos automáticos de Lico: activados (clic para desactivar)">&#128172;</button>
        <div class="letra-ctrl" role="group" aria-label="Tamaño de letra">
          <button id="letra-menos" class="icono-btn" type="button" title="Achicar letra (Ctrl+Alt+-)" aria-label="Achicar letra">A&minus;</button>
          <button id="letra-nivel" class="letra-nivel" type="button" title="Volver al tamaño normal (Ctrl+Alt+0)" aria-label="Tamaño actual; clic para volver al normal">100%</button>
          <button id="letra-mas" class="icono-btn" type="button" title="Agrandar letra (Ctrl+Alt++)" aria-label="Agrandar letra">A+</button>
        </div>
        <button id="tema" class="icono-btn" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
        <span class="estado" id="estado"></span>
      </div>
      <nav id="nav">
        <button data-tab="disponibles" class="activo"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="1.5"/><path d="M3 8h14M7 2v4M13 2v4M10 10.5v4.5M7.75 12.75h4.5"/></svg>Citas disponibles</button>
        <button data-tab="agenda"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="1.5"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>Agenda</button>
        <button data-tab="espera"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2.5"/></svg>Lista de espera<span class="nav-badge" id="badge-espera" hidden></span></button>
        <button data-tab="porconfirmar"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M6.5 10l2.5 2.5 5-5"/></svg>Por confirmar<span class="nav-badge" id="badge-porconfirmar" hidden></span></button>
        <button data-tab="vencimientos"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 2.5h8M6 17.5h8M7 2.5c0 4 6 4.5 6 7.5s-6 3.5-6 7.5M13 2.5c0 4-6 4.5-6 7.5s6 3.5 6 7.5"/></svg>Por vencer</button>
        <button data-tab="analitica"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17h14M5.5 17v-5M10 17V5M14.5 17V9"/></svg>Estadísticas</button>
        <div class="nav-mas" id="nav-mas">
          <button type="button" id="nav-mas-btn" class="nav-mas-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav-mas-menu"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg>Más<span class="nav-badge" id="badge-mas" hidden></span><span class="nav-mas-flecha" aria-hidden="true">▾</span></button>
          <div class="nav-mas-menu" id="nav-mas-menu" role="menu" aria-labelledby="nav-mas-btn" hidden>
          <button type="button" role="menuitem" data-tab="jefatura" data-nav-movible="1"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2.5" width="12" height="15" rx="1.5"/><path d="M7 13.5v-2M10 13.5v-5M13 13.5v-3.5M7 5.5h6"/></svg>Jefatura</button>
          <button type="button" role="menuitem" data-tab="papelera" data-nav-movible="2"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5 5.5l.8 11a1 1 0 001 1h6.4a1 1 0 001-1l.8-11M8.5 9v5M11.5 9v5"/></svg>Papelera<span class="nav-badge" id="badge-papelera" hidden></span></button>
          <button type="button" role="menuitem" data-tab="datos" data-nav-movible="3"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="5" rx="6" ry="2.5"/><path d="M4 5v10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V5M4 10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></svg>Datos</button>
          <button type="button" role="menuitem" data-tab="errores" data-nav-movible="4"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3L2.5 16.5h15L10 3zM10 8.5v3.5M10 14.3v.2"/></svg>Reporte de errores<span class="nav-badge" id="badge-errores" hidden></span></button>
          </div>
        </div>
        <button data-tab="examinador"><svg class="nav-ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="2.5" width="8" height="15" rx="1.5"/><path d="M9 15h2"/></svg>Examinador</button>
      </nav>
    </div>
  </header>

  <main id="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="lico.js?v=58"></script>
  <script src="lico-juegos.js?v=58"></script>
  <script src="lico-asistente.js?v=91"></script>
  <script src="estadisticas.js?v=76"></script>
  <script src="lista-espera.js?v=88"></script>
  <script src="limpieza.js?v=60"></script>
  <script src="movil.js?v=62"></script>
  <script src="js/core.js?v=94"></script>
  <script src="js/editor-cita.js?v=84"></script>
  <script src="js/porconfirmar.js?v=86"></script>
  <script src="js/agenda.js?v=102"></script>
  <script src="js/bloqueos.js?v=72"></script>
  <script src="js/grilla.js?v=87"></script>
  <script src="js/reagendar.js?v=88"></script>
  <script src="js/buscar.js?v=72"></script>
  <script src="js/dia.js?v=90"></script>
  <script src="js/analitica.js?v=85"></script>
  <script src="js/datos.js?v=73"></script>
  <script src="js/guia-pasos.js?v=90"></script>
  <script src="js/guia.js?v=80"></script>
  <script src="js/jefatura.js?v=76"></script>
  <script src="js/main.js?v=94"></script>
  <script src="responsive.js?v=66"></script>
</body>
</html>
