name = "agenda-practicos"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "agenda-practicos-db"
database_id = "7f0b5ae1-e5e3-4c72-8727-8d931110d837"
migrations_dir = "migrations"

# Todas las variables de entorno (secretas o no: AGENDA_SECRET, AGENDA_PIN,
# AGENDA_URL_PUBLICA, AGENDA_ORGANISMO, AGENDA_UNIDAD, y mas adelante
# RESEND_API_KEY/RESEND_FROM) se configuran con `wrangler pages secret put`
# despues de crear el proyecto Pages (ver plan, paso de despliegue 6) -- Pages
# no usa un bloque [vars] en wrangler.toml como los Workers "sueltos".
